services:
  app:
    build:
      context: .
      args:
        REACT_APP_AUTH0_DOMAIN: ${REACT_APP_AUTH0_DOMAIN:-placeholder.auth0.com}
        REACT_APP_AUTH0_CLIENT_ID: ${REACT_APP_AUTH0_CLIENT_ID:-placeholder-client-id}
    ports:
      - '${PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
