services:
  app:
    build:
      context: .
      args:
        REACT_APP_AUTH0_DOMAIN: ${REACT_APP_AUTH0_DOMAIN:?REACT_APP_AUTH0_DOMAIN is required}
        REACT_APP_AUTH0_CLIENT_ID: ${REACT_APP_AUTH0_CLIENT_ID:?REACT_APP_AUTH0_CLIENT_ID is required}
        REACT_APP_AIRTABLE_API_KEY: ${REACT_APP_AIRTABLE_API_KEY:?REACT_APP_AIRTABLE_API_KEY is required}
        REACT_APP_AIRTABLE_BASE_ID: ${REACT_APP_AIRTABLE_BASE_ID:?REACT_APP_AIRTABLE_BASE_ID is required}
        REACT_APP_AIRTABLE_CONTENT_ITEMS_TABLE: ${REACT_APP_AIRTABLE_CONTENT_ITEMS_TABLE:-ContentItems}
        REACT_APP_AIRTABLE_CONTENT_BLOCKS_TABLE: ${REACT_APP_AIRTABLE_CONTENT_BLOCKS_TABLE:-ContentBlocks}
        REACT_APP_AIRTABLE_ITEM_TITLE_FIELD: ${REACT_APP_AIRTABLE_ITEM_TITLE_FIELD:-Title}
        REACT_APP_AIRTABLE_ITEM_SLUG_FIELD: ${REACT_APP_AIRTABLE_ITEM_SLUG_FIELD:-Slug}
        REACT_APP_AIRTABLE_ITEM_PUBLISHED_FIELD: ${REACT_APP_AIRTABLE_ITEM_PUBLISHED_FIELD:-Published}
        REACT_APP_AIRTABLE_BLOCK_ITEM_FIELD: ${REACT_APP_AIRTABLE_BLOCK_ITEM_FIELD:-ContentItem}
        REACT_APP_AIRTABLE_BLOCK_ORDER_FIELD: ${REACT_APP_AIRTABLE_BLOCK_ORDER_FIELD:-Order}
        REACT_APP_AIRTABLE_BLOCK_TYPE_FIELD: ${REACT_APP_AIRTABLE_BLOCK_TYPE_FIELD:-Type}
        REACT_APP_AIRTABLE_BLOCK_PAYLOAD_FIELD: ${REACT_APP_AIRTABLE_BLOCK_PAYLOAD_FIELD:-Payload}
    ports:
      - '${PORT:-8080}:80'
    restart: unless-stopped
