services:
  app:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'
      - '3001:3001'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      PORT: 3001
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

volumes:
  node_modules:
